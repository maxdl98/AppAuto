# Configurazione per l'applicazione
spring.application.name=AutoApp

# Configurazione del datasource MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/autoapp
spring.datasource.username=root
spring.datasource.password=1234
spring.jpa.hibernate.ddl-auto=update

# Configurazione Thymeleaf
spring.thymeleaf.check-template-location=false
app.frontend.url=http://localhost:8080/api/v1
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.open-in-view=false


# Configurazione del pool di task
spring.task.execution.pool.size=10    # Numero massimo di thread
spring.task.execution.pool.keep-alive=60s
spring.task.execution.pool.queue-capacity=500
logging.level.org.springframework.data.jpa.repository.query=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
spring.web.resources.add-mappings=false